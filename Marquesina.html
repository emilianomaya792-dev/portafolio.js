<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Marquesina</title>

    <link rel="stylesheet" href="mi_estilo.css">

    <style>

        #contenedor{
            width: 100%;
            overflow: hidden;
            background-color: #2c3e50;
            color: white;
            padding: 15px 0;
            margin-top: 50px;
        }

        #mensaje{
            position: relative;
            left: 100%;
            white-space: nowrap;
        }

    </style>

</head>

<body>

    <h1>Proyecto Marquesina</h1>

    <div id="contenedor">
        <div id="mensaje">
            Bienvenido a mi portafolio de JavaScript
        </div>
    </div>

    <script>

        let mensaje = document.getElementById("mensaje");
        let posicion = window.innerWidth;

        function mover(){

            posicion--;

            mensaje.style.left = posicion + "px";

            if(posicion < -400){
                posicion = window.innerWidth;
            }

        }

        setInterval(mover, 5);

    </script>

</body>

</html>
